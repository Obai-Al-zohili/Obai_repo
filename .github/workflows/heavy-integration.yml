# Heavy check: the whole user workflow inside a real VS Code (test/integration/). Starts the extension in a
# throwaway Git repository with the published model and the real llama.cpp server, then runs `git add` in
# terminals, answers Y/N, and checks the commits, the toggle, the ✨ button, and that nothing prompts when it
# shouldn't. @vscode/test-electron downloads VS Code; Linux has no screen, so it runs under xvfb.
name: "heavy: integration tests"

on:
  push:
    branches: [master]
    tags: ["v*"]
  schedule:
    - cron: "0 3 * * *" # nightly, 03:00 UTC
  workflow_dispatch:

env:
  MODEL_URL: https://huggingface.co/Obai-Al-zohili/commit-model/resolve/main/commit-model-Q4_K_M.gguf
  MODEL_FILE: model/commit-model-Q4_K_M.gguf

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      # Same cache as the smoke test: the model (~1 GB) is downloaded once per OS.
      - uses: actions/cache@v4
        id: model
        with:
          path: model
          key: model-q4km-${{ runner.os }}
      - if: steps.model.outputs.cache-hit != 'true'
        run: mkdir -p model && curl -fL --retry 3 -o "$MODEL_FILE" "$MODEL_URL"
      - if: runner.os == 'Linux'
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - run: npm ci
        working-directory: vscode-extension
      - name: Integration tests (Linux, virtual screen)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
        working-directory: vscode-extension
        env:
          COMMIT_MODEL_PATH: ${{ github.workspace }}/${{ env.MODEL_FILE }}
      - name: Integration tests
        if: runner.os != 'Linux'
        run: npm run test:integration
        working-directory: vscode-extension
        env:
          COMMIT_MODEL_PATH: ${{ github.workspace }}/${{ env.MODEL_FILE }}
