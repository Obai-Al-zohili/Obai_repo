# Release: publishes the extension to the VS Code Marketplace when a version tag (v0.1.1, ...) is pushed.
# The Marketplace refuses a version it already has, so the tag must match vscode-extension/package.json.
# Needs the repository secret VSCE_PAT: an Azure DevOps token with the Marketplace → Manage scope.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  # The fast checks again, on every OS: nothing is published unless all of them pass.
  check:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run test:unit # compiles first
      - run: python -m unittest tests.test_postprocess
        working-directory: .
      - run: npx vsce package --out commit-model.vsix

  publish:
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - name: The tag matches the package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run compile
      - run: npx vsce package --out commit-model.vsix
      - name: Publish to the VS Code Marketplace
        run: npx vsce publish --packagePath commit-model.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - uses: actions/upload-artifact@v4
        with:
          name: commit-model-${{ github.ref_name }}
          path: vscode-extension/commit-model.vsix
