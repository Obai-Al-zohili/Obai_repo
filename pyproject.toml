[project]
name = "beemo"
version = "0.1.0"
description = "AI commit message generator — fine-tuned LLM that writes Conventional Commits messages from staged diffs"
authors = [{name = "Obai Al-zohili", email = "obaizohili2004@gmail.com"}]
requires-python = ">=3.11"
dependencies = [
    "transformers>=4.46",
    "peft>=0.13",
    "bitsandbytes>=0.44",
    "accelerate>=1.0",
    "trl>=0.11",
    "datasets>=3.0",
    "sentencepiece",
    "evaluate",
    "sacrebleu",
    "rouge-score",
    "nltk>=3.8",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]

[project.scripts]
beemo = "commit_model.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
